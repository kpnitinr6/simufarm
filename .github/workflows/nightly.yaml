name: Manual web smoke only
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
# No nightly scheduled run or Android emulator job enabled before repository/free-quota verification.
