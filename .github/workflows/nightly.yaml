name: Nightly web smoke
on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:
jobs:
  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
# P5 native APK matrix requires an approved KVM self-hosted runner and sample APK.
