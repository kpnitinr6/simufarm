name: Free-path code checks
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -e ./packages/device-schema -e '.[dev]'
      - run: npm ci
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/validate_data.py
      - run: npm run contracts:check
      - run: npm run build
# No deploy, emulator, API extraction, paid runners or cloud provisioning steps.
# Confirm public-repository standard-runner free eligibility before enabling remotely.

# Supplied repository is PRIVATE; billing usage is not readable with the current token.
# Do not dispatch until included minutes and zero-spend enforcement are verified.
