name: Shell and profile checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -e ./packages/device-schema -e '.[dev]'
      - run: npm ci
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/validate_data.py --allow-draft
      - run: npm run contracts:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
# PUBLIC repository; standard runner only. No emulator, deploy, API or billable artifacts.
